version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: cyberguard-postgres
    restart: always
    environment:
      POSTGRES_USER: cyberguard
      POSTGRES_PASSWORD: cyberguard_secret
      POSTGRES_DB: cyberguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberguard -d cyberguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cyberguard-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: cyberguard-backend
    restart: always
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=cyberguard
      - POSTGRES_PASSWORD=cyberguard_secret
      - POSTGRES_DB=cyberguard_db
      - REDIS_HOST=redis
      - SECRET_KEY=09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: cyberguard-worker
    restart: always
    command: python -m app.workers.event_worker
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=cyberguard
      - POSTGRES_PASSWORD=cyberguard_secret
      - POSTGRES_DB=cyberguard_db
      - REDIS_HOST=redis
      - SECRET_KEY=09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: cyberguard-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
